[package]
name = "trading-vault"
version = "0.1.0"
description = "Solana trading vault: on-chain swap via DAMM V2, admin-only withdrawals"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trading_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.0", features = ["token", "token_2022", "associated_token"] }
